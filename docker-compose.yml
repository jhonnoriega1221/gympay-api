services:
  db:
    image: postgres:17
    container_name: gympay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gympay}
      POSTGRES_USER: ${POSTGRES_USER:-gympay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gympay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gympay-pgdata: